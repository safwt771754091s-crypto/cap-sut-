name = "capsut-api"
main = "src/index.ts"
compatibility_date = "2026-11-17"

[[d1_databases]]
binding = "DB"
database_name = "capsut-production"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGINS = "https://safwt771754091s-crypto.github.io"
SESSION_TTL_SECONDS = "2592000"
FAL_VIDEO_MODEL = "fal-ai/wan/v2.7/text-to-video"
FAL_IMAGE_VIDEO_MODEL = "fal-ai/wan/v2.7/image-to-video"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "capsut-media"
