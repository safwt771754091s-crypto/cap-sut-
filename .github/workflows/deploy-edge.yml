name: Deploy Cap sut Edge Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capsut-edge-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision and deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CAPSUT_D1_DATABASE_ID: ${{ secrets.CAPSUT_D1_DATABASE_ID }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets and D1 configuration
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          test -n "$CAPSUT_D1_DATABASE_ID" || { echo "Missing CAPSUT_D1_DATABASE_ID repository secret"; exit 1; }
          test -n "$FAL_KEY" || { echo "Missing FAL_KEY repository secret"; exit 1; }
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("apps/edge/wrangler.toml")
          config = path.read_text()
          placeholder = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
          database_id = os.environ["CAPSUT_D1_DATABASE_ID"].strip()
          if not database_id or any(ch not in "0123456789abcdef-" for ch in database_id.lower()):
              raise SystemExit("CAPSUT_D1_DATABASE_ID is not a valid D1 database identifier")
          if placeholder not in config and database_id not in config:
              raise SystemExit("wrangler.toml already contains a different D1 database ID; review it before deploying")
          path.write_text(config.replace(placeholder, database_id))
          PY

      - name: Install Wrangler
        working-directory: apps/edge
        run: npm install --no-save --no-audit --no-fund wrangler@4

      - name: Apply D1 migrations
        working-directory: apps/edge
        run: npx wrangler d1 migrations apply capsut-production --remote --yes

      - name: Configure fal provider secret
        working-directory: apps/edge
        run: printf '%s' "$FAL_KEY" | npx wrangler secret put FAL_KEY

      - name: Deploy Cloudflare Worker
        working-directory: apps/edge
        run: npx wrangler deploy
