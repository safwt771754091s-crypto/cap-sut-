name: Core validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  render-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Generate deterministic input MP4
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i color=c=black:s=1280x720:r=30:d=2 \
            -f lavfi -i anullsrc=r=48000:cl=stereo \
            -t 2 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac \
            /tmp/capsut-input.mp4
      - name: Render through Cap sut
        run: |
          cat > /tmp/capsut-project.json <<'JSON'
          {
            "schema_version": "0.1.0",
            "project": {
              "id": "ci-render",
              "name": "CI Render",
              "width": 1280,
              "height": 720,
              "frame_rate": {"numerator": 30, "denominator": 1}
            },
            "assets": [{
              "id": "a1",
              "uri": "file:///tmp/capsut-input.mp4",
              "mime_type": "video/mp4",
              "duration_seconds": 2.0
            }],
            "timeline": {
              "duration_seconds": 1.0,
              "tracks": [{
                "id": "v1",
                "kind": "video",
                "clips": [{
                  "id": "c1",
                  "asset_id": "a1",
                  "timeline_start_seconds": 0.0,
                  "source_in_seconds": 0.5,
                  "source_out_seconds": 1.5
                }]
              }]
            }
          }
          JSON
          cargo run -p capsut-render --bin capsut-render -- /tmp/capsut-project.json /tmp/capsut-output.mp4
          test -s /tmp/capsut-output.mp4
          ffprobe -v error -show_entries format=format_name,duration -of default=noprint_wrappers=1 /tmp/capsut-output.mp4
